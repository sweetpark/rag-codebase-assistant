<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>검색 및 등록</title>

    <!-- ag-Grid 라이브러리 추가 -->
    <!--    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@34.0.2/styles/ag-grid.min.css" rel="stylesheet" />-->
    <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/dist/styles/ag-grid.css">
    <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/dist/styles/ag-theme-alpine.css">
    <script src="https://unpkg.com/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
        }

        #dialog {
            display: none;
            position: fixed;
            top: 30%;
            left: 40%;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #888;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 9999;
        }

        #dialog-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 9998;
        }

        .ag-theme-alpine {
            height: 400px;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>계정 정보</h2>
<hr>
<button id="srch_btn" data-service="account" data-oper="read">조회</button>
<button id="reg_btn" data-service="account" data-oper="create" data-dialog="reg.html">등록</button>

<!-- ag-Grid 영역 -->
<div id="myGrid" class="ag-theme-alpine"></div>

<!-- 다이얼로그 삽입 위치 -->
<div id="dialog-container"></div>

<script>

    let gridOptions;
    var gridApi;
    var EDIT_FLG = false;
    var EDIT_ID = null;

    /**
     * [기능요약] 계정 조회를 하는 공통 핸들러
     *
     * [상세설명]
     * - 버튼(data-oper)에 따라 전체 조회, 상세 조회 등을 분기 처리
     * - payload 수집 및 ajax 요청 처리
     */
    $(document).ready(function(){

        // ########################## [GRID 정의] #####################################
        // ag-Grid 컬럼 정의
        const columnDefs = [
            { headerName: "ID", field: "id", width: 80 },
            { headerName: "사용자이름", field: "username" },
            { headerName: "상호명", field: "company_name" },
            { headerName: "대표자명", field: "ceo_name" },
            { headerName: "이메일", field: "email" },
            { headerName: "휴대폰 번호", field: "phone" },
            { headerName: "사업자번호", field: "biz_no" },
            { headerName: "비밀번호 초기화", field: "id", cellRenderer: function(params){
                    return `<button class="pw_reset" data-service="account" data-oper="reset" data-id="${params.data.id}">비밀번호 초기화 </button>`;
                }},
            {
                headerName: "상세정보", field: "id", cellRenderer: function(params) {
                    return `<button class="detail-btn" data-service="account" data-oper="detail" data-id="${params.data.id}">상세보기</button>`;
                }
            }
        ];

        const rowData = [];

        gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData,
            defaultColDef: {
                sortable: true,
                filter: true,
                resizable: true
            }
        };

        var eGridDiv = document.getElementById("myGrid");
        gridApi = agGrid.createGrid(eGridDiv, gridOptions);

        // ########################## [ 동적 스크립트 작성 ] #####################################

        // 등록 버튼 클릭 시 reg.html 로드 후 다이얼로그 표시
        $('#reg_btn').on('click', function(){
            EDIT_FLG=false;
            $('#dialog-container').load('reg.html', function() {
                initializeDialogEvents();
                showDialog();
            });
        });

        $(document).on('click','#srch_btn, .pw_reset, .detail-btn', function(){
            const btn = $(this)
            const service = btn.data('service');
            const oper = btn.data('oper');
            const id = btn.data('id');

            const payload = {oper : oper};
            if(id !== undefined) payload.id = id;

            sendAjax('POST', service, payload, function(res){
                if(oper === 'read'){
                    gridApi.updateGridOptions({rowData: res.data});
                }else if(oper === 'reset'){
                    alert('비밀번호 초기화 완료');
                }else if(oper === 'detail'){
                    EDIT_FLG=true;
                    EDIT_ID=id;
                    $('#dialog-container').load('reg.html', function() {
                        initializeDialogEvents();
                        showDialog();

                        // 예시: 상세정보 다이얼로그에 info 넣기
                        $('#dialog .content').text(id);
                    });
                }
            });
        });

        function showDialog() {
            $('#dialog-overlay').show();
            $('#dialog').show();
        }

        function hideDialog() {
            $('#dialog').hide();
            $('#dialog-overlay').hide();
        }

        function initializeDialogEvents() {
            $('#dialog-container').on('click', '#close_btn, #dialog-overlay', function () {
                hideDialog();
            });
        }

    });
    function sendAjax(type, service ,data, _callback) {
        $.ajax({
            url: '/api/main', // 실제 API 주소로 교체
            type: type,
            contentType: 'application/json',
            data: JSON.stringify({
                service: service,
                payload: data
            }),
            success: function(response) {
                if (_callback) _callback(response);
            },
            error: function(xhr) {
                const errMsg = xhr.responseJSON?.message || "오류가 발생했습니다.";
                alert("초기화 실패: " + errMsg);
            }
        });


    }

</script>

</body>
</html>
